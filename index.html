<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1 id="app-title">Todo App</h1>
        <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Toggle Dark Mode">🌙</button>
      </header>

      <form id="todo-form">
        <div class="input-row">
          <input type="text" id="todo-input" placeholder="Enter a new task" maxlength="100" required autocomplete="off" />
          <button type="submit" id="add-button" disabled>Add Task</button>
        </div>
        <div id="char-count">0 / 100</div>
      </form>

      <ul id="todo-list" role="list" aria-label="Todo items"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
